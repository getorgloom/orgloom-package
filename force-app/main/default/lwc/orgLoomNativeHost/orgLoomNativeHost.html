<template>
    <template lwc:if={error}><p role="alert">{error}</p></template>
    <template lwc:if={source}><div class="canvas-viewport" style={viewportStyle}><iframe src={source} title="Org Loom canvas" allow="clipboard-write" onload={frameLoaded}></iframe></div></template>
    <template for:each={jobs} for:item="job">
        <c-org-loom-native-layout key={job.id} request={job} onlayoutresult={completed}></c-org-loom-native-layout>
    </template>
</template>
